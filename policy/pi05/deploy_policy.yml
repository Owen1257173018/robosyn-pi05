# π0.5 policy configuration (team Owen). Simulator, from policy/pi05:
#   bash eval.sh <task_name> <setting> <checkpoint_path> [gpu_id]     e.g. bash eval.sh click_bell random checkpoints/click_bell 0
# Real robot: this file with task_name and checkpoint_path (the task's Hugging Face folder) set.

# ------------------------------------------------------------------
# Basic experiment configuration (Each policy must be retained.)
# ------------------------------------------------------------------
policy_name: pi05
task_name: null
setting: null
model_name: null
seed: 0
max_episodes: 20
max_steps: 1000 # Maximum environment steps per episode. Effective limit is max(deploy_config.max_steps, gym_config.max_episode_steps).
headless: false
pytorch_device: cpu
filter_dataset_saving: true
eval_video_log: true
eval_video_obs_keys:
  - cam_high
  - cam_right_wrist
  - cam_left_wrist
eval_expert_check: true

# ------------------------------------------------------------------
# Add policy-related parameters you needing, used for get_model()
# ------------------------------------------------------------------
checkpoint_path: null # The task's checkpoint folder, i.e. the Hugging Face folder <task_name>/ (params/, assets/). Default: policy/pi05/checkpoints/<task_name>.
train_config_name: null # Optional; by default the task's openpi config (TRAIN_CONFIGS in pi_model.py).
pi0_step: 10 # It only represents the number of execution steps. not the horizon of reasoning, it's the horizon of execution.
action_samples: 1 # Action chunks sampled per inference (each with new flow-matching noise) and averaged.
noise_scale: 1.0 # Scale of the flow-matching noise each chunk is sampled from: 1 is the trained distribution, smaller values sample closer to the most likely chunk, 0 is deterministic.
open_grippers_at_start: true # Open the grippers the demonstrations open at the start (pi_model.OPEN_AT_START) for the first chunk.
close_drawer_after_place: false # drawer_open_place only: after the object is placed, push the drawer shut by reversing the right arm's pull (drawer_closer.py). The real-robot criterion ends with the object in the open drawer (FAQ2-06); true in the simulator, whose success check (object within 0.1 m of the drawer body in XY) needs the drawer closed.
episode_time_limit_s: 540 # Wall-clock budget of one episode, counted from reset_model: once it is used up, eval() stops sending actions and returns truncated=True (a timeout), so that an episode cannot run into the evaluation's 600-second limit. null disables it.
warm_up: true # Run one inference on a blank observation when the model is loaded, so that XLA compiles before the first episode (its random key is restored, so the episodes are unchanged).
rescale_gripper: true # Map the gripper output (normalized opening, as in the Real data) into the env's gripper action range, as the official SmolVLA adapter does: the simulator takes meters (0-0.05), and the real robot takes the same actions as the simulator (FAQ2-11).
